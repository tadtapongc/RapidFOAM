[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rapidfoam"
dynamic = ["version"]
description = "Rapid external aerodynamics and OpenFOAM automation suite for Rapidamente Formula Student"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tadtapong C. (Rapidamente Formula Student)", email = "tadtapong2549@gmail.com" }
]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
keywords = [
    "openfoam",
    "cfd",
    "aerodynamics",
    "fsae",
    "formula-student",
    "snappyhexmesh",
    "simplefoam",
]

[tool.hatch.version]
path = "src/rapidfoam/__init__.py"

[project.urls]
Homepage = "https://github.com/tadtapongc/RapidFOAM"
Repository = "https://github.com/tadtapongc/RapidFOAM"
"Bug Tracker" = "https://github.com/tadtapongc/RapidFOAM/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "paramiko>=3.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
rapidfoam = "rapidfoam.cli:setup_main"
rapidfoam-setup = "rapidfoam.cli:setup_main"
rapidfoam-forces = "rapidfoam.cli:forces_main"
rapidfoam-monitor = "rapidfoam.postproc.convergence_monitor:main"
rapidfoam-studio = "rapidfoam.web.server:main"
rapidfoam-web = "rapidfoam.web.server:main"
# Backward-compatible aliases
cfd-setup = "rapidfoam.cli:setup_main"
cfd-forces = "rapidfoam.cli:forces_main"
cfd-monitor = "rapidfoam.postproc.convergence_monitor:main"
cfd-web = "rapidfoam.web.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rapidfoam"]

[tool.ruff]
line-length = 120
target-version = "py39"

